<!DOCTYPE html>
<html>
<head>
<title>Newsletter Signup Modal</title>
<style>
body{
 font-family: Arial;
 background: #f2f2f2;
 text-align: center;
 margin: 0;
}
.content{
 padding: 50px;
}
h2{ margin-bottom: 10px; }

/* overlay */
.overlay{
 display: none;
 position: fixed;
 top: 0; left: 0;
 width: 100%; height: 100%;
 background: rgba(0,0,0,0.6);
 justify-content: center;
 align-items: center;
}

/* modal box */
.modal{
 background: white;
 width: 300px;
 padding: 20px;
 border-radius: 10px;
 border: 1px solid black;
 position: relative;
}
.close{
 position: absolute;
 top: 8px;
 right: 12px;
 font-size: 20px;
 cursor: pointer;
 font-weight: bold;
}
input{
 width: 90%;
 padding: 8px;
 margin-top: 10px;
}
button{
 margin-top: 10px;
 padding: 8px 15px;
 cursor: pointer;
}
#msg{
 margin-top: 10px;
 font-size: 14px;
 color: red;
}
</style>
</head>
<body>

<div class="content">
 <h2>Welcome to My Website</h2>
 <p>Modal will appear after 2 seconds...</p>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
 <div class="modal">
  <span class="close" id="closeBtn">&times;</span>
  <h3>Subscribe to Newsletter</h3>
  <input type="text" id="email" placeholder="Enter your email">
  <br>
  <button onclick="subscribe()">Subscribe</button>
  <p id="msg"></p>
 </div>
</div>

<script>
let overlay = document.getElementById("overlay");
let closeBtn = document.getElementById("closeBtn");
let isClosed = false; // prevent reappearing

// modal after 2 sec - setTimeout
setTimeout(function(){
 if(!isClosed){
  overlay.style.display = "flex";
 }
}, 2000);

// close button
closeBtn.addEventListener("click", function(){
 overlay.style.display = "none";
 isClosed = true;
});

// overlay click to dismiss
overlay.addEventListener("click", function(e){
 if(e.target === overlay){
  overlay.style.display = "none";
  isClosed = true;
 }
});

// email validation
function subscribe(){
 let email = document.getElementById("email").value;
 let msg = document.getElementById("msg");
 
 // simple email regex
 let pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

 if(email === ""){
  msg.innerText = "Please enter email";
 } else if(!email.match(pattern)){
  msg.innerText = "Invalid email format";
 } else {
  msg.style.color = "green";
  msg.innerText = "Subscribed successfully!";
  setTimeout(() => {
   overlay.style.display = "none";
   isClosed = true;
  }, 1000);
 }
}
</script>

</body>
</html>
